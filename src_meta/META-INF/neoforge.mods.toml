modLoader="javafml"
loaderVersion="[1,)"
license="MIT License"

[[mods]]
modId="craftingveloce"
version="1.0.0"
displayName="CraftingVeloce"
authors="olafalencynowicz"
description='''
CraftingVeloce - pipe network, auto-crafter and terminal for Tom's Simple Storage.
Requires Tom's Simple Storage: our pipes ARE its cable blocks and the terminal
is built on its terminal block. Refined Storage support is optional.
'''

[[dependencies.craftingveloce]]
    modId="neoforge"
    type="required"
    versionRange="[21.0.0-beta,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.craftingveloce]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.0,1.21.2)"
    ordering="NONE"
    side="BOTH"

# TOM'S SIMPLE STORAGE - WYMAGANY i to nie jest przypadkowe.
#
# Trzydziesci piec odwolan w siedmiu plikach, wszystkie strukturalne:
#   - VelocePipeBlock / VelocePipeBlockEntity  implementuja IInventoryCable
#     i dziedzicza po PlatformBlockEntity; nasze rury SA kablami Toma
#   - VeloceTomTerminalBlock dziedziczy po AbstractStorageTerminalBlock
#   - VeloceTomTerminalBlockEntity dziedziczy po StorageTerminalBlockEntity
#     i uzywa NetworkInventory / StoredItemStack / IInventoryAccess
#   - Controller, CraftingTable, Extractor implementuja IInventoryCable
#
# NIE zmieniaj tego na "optional" bez przepisania tych klas. Samo przelaczenie
# flagi nie sprawi, ze mod ruszy bez Toma - klasy nie zaladuja sie bez jego
# typow (NoClassDefFoundError przy rejestracji blokow). Zamiast czytelnego
# "brakuje zaleznosci" gracz dostalby niezrozumialy crash.
[[dependencies.craftingveloce]]
    modId="toms_storage"
    type="required"
    versionRange="[2.4.0,)"
    ordering="AFTER"
    side="BOTH"

# REFINED STORAGE - opcjonalny. Integracja (RefinedStorageHelper) jest w calosci
# opakowana w try/catch(Throwable), a jej sygnatury nie uzywaja typow RS, wiec
# brak tego moda niczego nie psuje - endpointy RS po prostu nie istnieja.
[[dependencies.craftingveloce]]
    modId="refinedstorage"
    type="optional"
    versionRange="[2.0.0,)"
    ordering="AFTER"
    side="BOTH"

# --- OPCJONALNE INTEGRACJE (soft-dependencies) --------------------------
#
# KAZDA z nich jest "optional" CELOWO. Modul z integracja zyje w
# com/craftingveloce/compat/<mod>/ i ma obce typy WYLACZNIE w ciele metod,
# wolanych po sprawdzeniu obecnosci moda (bramka XCompat.isPresent()).
# Rdzen nie importuje niczego z tych modow - pilnuje tego build.py
# (validate_core_isolation) i kontrola wyciekow w JARze.
#
# NIE zmieniaj "optional" na "required": gracz bez Create/Alchemistry/
# Mekanism ma dostac dzialajacy mod bez tych integracji, a nie blad
# ladowania. Odwrotnie - dopisanie "required" nie naprawi zadnego bledu,
# tylko uniemozliwi uruchomienie.

# CREATE - maszyny kinetyczne (mlyn, piła, prasa, basen, mechanical crafting).
# Wersja przypieta do serii 6.0.x: klasy kinetyczne to API "spolecznosciowe",
# ktore potrafi sie zmienic miedzy wersjami.
[[dependencies.craftingveloce]]
    modId="create"
    type="optional"
    versionRange="[6.0.7,6.1.0)"
    ordering="AFTER"
    side="BOTH"

# ALCHEMISTRY - maszyny chemiczne zasilane FE (compactor, combiner, fission).
# Wchodzi razem z AlchemyLib i ChemLib (biblioteki Alchemistry).
[[dependencies.craftingveloce]]
    modId="alchemistry"
    type="optional"
    versionRange="[2.4.0,)"
    ordering="AFTER"
    side="BOTH"

# MEKANISM - maszyny itemowe zasilane FE (crusher, enrichment, combiner, sawmill).
[[dependencies.craftingveloce]]
    modId="mekanism"
    type="optional"
    versionRange="[10.7.0,)"
    ordering="AFTER"
    side="BOTH"

# JEI - podglad przepisow. Opcjonalny i to nie jest forma grzecznosci: plugin
# (compat/jei/VeloceJeiPlugin) jest z obcym typem w sygnaturze, wiec bez JEI nie
# ma go kto zaladowac - JEI samo skanuje adnotacje @JeiPlugin. Bez JEI mod dziala
# normalnie, tylko nie ma listy "w tym mozna to zrobic".
[[dependencies.craftingveloce]]
    modId="jei"
    type="optional"
    versionRange="[19.0.0,)"
    ordering="AFTER"
    side="BOTH"

# JADE - podpowiedz przy celowniku: predkosc/SU/energia, stan sieci i status
# ("za malo sily"). Tak samo jak JEI: plugin (compat/jade/VeloceJadePlugin) ma
# obce typy w sygnaturach i laduje go samo Jade po adnotacji @WailaPlugin.
[[dependencies.craftingveloce]]
    modId="jade"
    type="optional"
    versionRange="[15.0.0,)"
    ordering="AFTER"
    side="BOTH"


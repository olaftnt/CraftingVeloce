plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

base {
    // THE RELEASE FILE NAME, and every segment of it is there for a reason.
    //
    //   craftingveloce - 1.0.0 - NeoForge - 1.21.1
    //   ^ the mod      ^ its    ^ the      ^ the game it loads into
    //                    version  loader
    //
    // A bare `craftingveloce-1.0.0.jar` is ambiguous the moment a second loader exists (the
    // repository is named "multiloader" for that reason even though only neoforge/ is built
    // today): a player looking at a downloads folder cannot tell which jar goes with which
    // loader, and neither can a Modrinth version list. The loader and the game version also
    // make a wrong download obvious BEFORE it is dropped into a mods folder, which is where
    // an incompatible jar normally announces itself - as a crash.
    archivesName = "craftingveloce"
}

// The file name is built HERE rather than from `archivesName` alone.
//
// Gradle composes `archivesName-version`, which puts the version last:
// `craftingveloce-1.0.0-NeoForge-1.21.1` is not reachable that way - the loader and the game
// version would have to sit between the mod name and the version, and `-<version>` is
// appended after whatever archivesName says. Setting the whole name explicitly is the only
// way to get the requested order, and it keeps the version in ONE place: mod_version.
tasks.named("jar", Jar) {
    archiveFileName = "craftingveloce-${project.mod_version}-NeoForge-1.21.1.jar"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    mods {
        craftingveloce {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }

        // Automated test run: loads straight into a world, runs the script named
        // by the system property, prints the result and exits.
        //
        //   ./gradlew :neoforge:runTestClient -PveloceTest=smoke
        //
        // The world has to be one that already exists in run/saves - the flat
        // creative world the scripts expect is made once and reused.
        testClient {
            client()
            // A game directory of its OWN, and this is not tidiness.
            //
            // It used to share run/ with the normal client, so starting an automated
            // run while a dev client was open meant two processes fighting over the same
            // world, the same logs and the same result file - the test then hung until
            // it timed out, with nothing saying why. The two can now run at the same
            // time, which is what the person testing by hand needs.
            gameDirectory = file("run-tests")
            systemProperty("veloce.test.script",
                    file("../neoforge/veloce-tests/${project.findProperty('veloceTest') ?: 'smoke'}.txt").absolutePath)
            programArguments.addAll("--quickPlaySingleplayer",
                    project.findProperty('veloceTestWorld') ?: 'New World')

            // --- QUIET WINDOW -------------------------------------------------------
            // The test still needs a real GL context (it drives the terminal SCREEN and
            // reads back what that screen drew), so it cannot be truly headless. What it
            // can be is inconspicuous: these keep the Java/Minecraft window out of the
            // way and stop it stealing focus while a suite runs.
            //
            // apple.awt.UIElement removes the macOS Dock icon and the app's menu bar -
            // the "extra Java window" that pops up on every run. It is macOS-only and
            // harmless elsewhere.
            systemProperty("apple.awt.UIElement", "true")
            // A small window instead of a full-screen-sized one, parked at the top-left.
            programArguments.addAll("--width", "640", "--height", "360")
            // -PveloceTestVisible brings the window back for watching a run by hand.
            if (!project.hasProperty('veloceTestVisible')) {
                systemProperty("java.awt.headless", "false")
            }
            // -PveloceDumpIcons renders every casing icon to a PNG and exits - see
            // VeloceIconDump. Dev-only, and driven by a script so it can run unattended.
            systemProperty("veloce.dumpIconsAll",
                    project.hasProperty('veloceDumpIcons') ? "true" : "false")
            // -PveloceKeepOpen leaves the game open after the script, to watch it.
            if (project.hasProperty('veloceKeepOpen')) {
                systemProperty("veloce.test.keepOpen", "true")
            }
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = "Create"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "BlameJared (JEI, Jade)"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev"
    }
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me"
    }
}

dependencies {
    // --- Tom's Simple Storage is OPTIONAL now ---
    // Nothing in the mod references a Tom class any more (see mods.toml), so it is
    // not a compile dependency. It stays on the runtime classpath so a dev run has
    // it available to test the capability-based integration.
    runtimeOnly "maven.modrinth:toms-storage:WQAMoIMC"

    // --- optional integrations (compileOnly) ---
    compileOnly "maven.modrinth:create:UjX6dr61"
    compileOnly "net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1"
    compileOnly "mezz.jei:jei-1.21.1-neoforge:19.56.0.439"
    compileOnly "maven.modrinth:jade:eYz2YBGT"
    compileOnly "maven.modrinth:mekanism:5KzzycBT"
    compileOnly "maven.modrinth:refined-storage:lHHiI26k"
    // JEI annotates with @ApiStatus; javac warns without this on the path.
    compileOnly "org.apiguardian:apiguardian-api:1.1.2"

    // Alchemistry has no public maven we can resolve, so it stays a local file
    // dependency in libs/ (exactly as the old scripts/build.py did).
    def alchemistryJars = rootProject.files(
            "libs/alchemistry-1.21.1-2.4.5.jar",
            "libs/alchemylib-1.21.1-1.1.6.jar",
            "libs/chemlib-1.21.1-2.1.5.jar"
    )
    compileOnly alchemistryJars

    // --- present in the dev run, so the module blocks exist and can be tested by hand ---
    //
    // compileOnly above only satisfies javac; without these the optional mods are
    // absent at runtime, their blocks never register, and /cv testmodule reports
    // "no machine block registered" for every module that belongs to them.
    //
    // Create pulls two more jars, both from maven.createmod.net:
    //   net.createmod.ponder:ponder-neoforge           (the Ponder library)
    //   dev.engine-room.flywheel:flywheel-neoforge-*   (Flywheel, Create's renderer)
    runtimeOnly "maven.modrinth:mekanism:5KzzycBT"
    runtimeOnly "maven.modrinth:create:UjX6dr61"
    runtimeOnly "net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.4"
    runtimeOnly alchemistryJars

    // Recipe viewer and tooltip mod: not required by the mod, but the reason to
    // have them here is manual testing - JEI shows what a block can make and Jade
    // shows the machine status under the crosshair.
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.56.0.439"
    runtimeOnly "maven.modrinth:jade:eYz2YBGT"
}

// The game assets stay at the repository root (assets/, data/, src_meta/) so the
// existing scripts/build.py guards keep working and so changes made on main to
// those paths do not turn into delete/modify conflicts when we merge back.
processResources {
    from(rootProject.projectDir) {
        include "assets/**"
        // ONLY our own namespaces, listed one by one.
        //
        // This used to be `include "data/**"`, which swept up whatever happened to sit in
        // data/ - and data/toms_storage/ (a leftover from a mod this one no longer depends
        // on) was being shipped inside our own jar. A wildcard cannot tell whose data it is
        // collecting; a list can.
        include "data/craftingveloce/**"
        include "data/minecraft/**"
        include "data/c/**"
    }
    from(rootProject.file("src_meta")) {
        include "META-INF/**"
        // The mod list logo, named by `logoFile` in neoforge.mods.toml. It has to land
        // at the ROOT of the jar: ModListScreen resolves it with getRootResource, so a
        // copy under META-INF would simply not be found and the list would fall back to
        // the missing-texture placeholder.
        include "logo.png"
    }
}

// The mod reads scripts from <game dir>/veloce-tests. They are versioned here and
// copied next to the game so that /cv test run <name> works without extra setup.
tasks.register("stageTestScripts", Copy) {
    description = "Copies veloce-tests/ into the dev-run directory."
    from(layout.projectDirectory.dir("veloce-tests"))
    into(layout.projectDirectory.dir("run/veloce-tests"))
}

tasks.named("runClient") { dependsOn("stageTestScripts") }
// The test result is read from a FILE, not from the process exit code: a green
// automated run still ends with Minecraft's own non-zero shutdown status, so a
// CI job trusting the exit code would fail on every passing run.
// The automated run gets its own directory seeded from run/: the scripts, the config,
// and the flat creative world the scripts expect (made once, in run/, and copied here).
tasks.register("prepareTestRunDir") {
    description = "Seeds run-tests/ from run/ so automated runs do not touch the dev client."
    dependsOn("stageTestScripts")
    doLast {
        def testDir = layout.projectDirectory.dir("run-tests").asFile
        def runDir = layout.projectDirectory.dir("run").asFile
        project.copy {
            from(layout.projectDirectory.dir("veloce-tests"))
            into(new File(testDir, "veloce-tests"))
        }
        def config = new File(runDir, "config")
        if (config.exists() && !new File(testDir, "config").exists()) {
            project.copy { from(config); into(new File(testDir, "config")) }
        }
        def saves = new File(runDir, "saves")
        if (saves.exists() && !new File(testDir, "saves").exists()) {
            project.copy { from(saves); into(new File(testDir, "saves")) }
        }
    }
}

tasks.named("runTestClient") {
    dependsOn("prepareTestRunDir")
    ignoreExitValue = true
    doFirst {
        delete(layout.projectDirectory.file("run-tests/veloce-test-result.txt"))
    }
    doLast {
        def resultFile = layout.projectDirectory.file("run-tests/veloce-test-result.txt").asFile
        if (!resultFile.exists()) {
            throw new GradleException(
                    "no veloce-test-result.txt - the run never reached the end of the script")
        }
        def lines = resultFile.readLines()
        if (lines.isEmpty() || lines[0] != "PASS") {
            throw new GradleException("veloce test FAILED:\n  " + lines.join("\n  "))
        }
        logger.lifecycle("veloce test PASSED -> " + lines.join(" | "))
    }
}

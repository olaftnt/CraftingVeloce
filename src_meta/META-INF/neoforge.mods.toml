modLoader="javafml"
loaderVersion="[1,)"
license="MIT License"

[[mods]]
modId="craftingveloce"
version="1.0.0"
displayName="CraftingVeloce"
authors="olafalencynowicz"
description='''
CraftingVeloce - pipe network, auto-crafter and terminal for Tom's Simple Storage.
Requires Tom's Simple Storage: our pipes ARE its cable blocks and the terminal
is built on its terminal block. Refined Storage support is optional.
'''

[[dependencies.craftingveloce]]
    modId="neoforge"
    type="required"
    versionRange="[21.0.0-beta,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.craftingveloce]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.0,1.21.2)"
    ordering="NONE"
    side="BOTH"

# TOM'S SIMPLE STORAGE - REQUIRED, and that is not accidental.
#
# Thirty-five references across seven files, all of them structural:
#   - VelocePipeBlock / VelocePipeBlockEntity  implement IInventoryCable
#     and extend PlatformBlockEntity; our pipes ARE Tom's cables
#   - VeloceTomTerminalBlock extends AbstractStorageTerminalBlock
#   - VeloceTomTerminalBlockEntity extends StorageTerminalBlockEntity
#     and uses NetworkInventory / StoredItemStack / IInventoryAccess
#   - Controller, CraftingTable, Extractor implement IInventoryCable
#
# Do NOT change this to "optional" without rewriting those classes. Flipping
# the flag alone will not make the mod run without Tom - the classes will not
# load without his types (NoClassDefFoundError during block registration).
# Instead of a readable "missing dependency" the player would get an
# incomprehensible crash.
[[dependencies.craftingveloce]]
    modId="toms_storage"
    type="required"
    versionRange="[2.4.0,)"
    ordering="AFTER"
    side="BOTH"

# REFINED STORAGE - optional. The integration (RefinedStorageHelper) is wrapped
# entirely in try/catch(Throwable) and its signatures do not use RS types, so a
# missing mod breaks nothing - the RS endpoints simply do not exist.
[[dependencies.craftingveloce]]
    modId="refinedstorage"
    type="optional"
    versionRange="[2.0.0,)"
    ordering="AFTER"
    side="BOTH"

# --- OPTIONAL INTEGRATIONS (soft dependencies) --------------------------
#
# EACH of them is "optional" ON PURPOSE. An integration module lives in
# com/craftingveloce/compat/<mod>/ and has foreign types ONLY in method
# bodies, called after checking that the mod is present (the
# XCompat.isPresent() gate). The core imports nothing from those mods -
# build.py enforces this (validate_core_isolation) along with the JAR leak
# check.
#
# Do NOT change "optional" to "required": a player without Create/Alchemistry/
# Mekanism is supposed to get a working mod without those integrations, not a
# loading error. Conversely, adding "required" fixes no error - it only makes
# the mod impossible to start.

# CREATE - kinetic machines (millstone, saw, press, basin, mechanical crafting).
# The version is pinned to the 6.0.x series: the kinetic classes are a
# "community" API that can change between versions.
[[dependencies.craftingveloce]]
    modId="create"
    type="optional"
    versionRange="[6.0.7,6.1.0)"
    ordering="AFTER"
    side="BOTH"

# ALCHEMISTRY - FE-powered chemical machines (compactor, combiner, fission).
# Comes together with AlchemyLib and ChemLib (Alchemistry's libraries).
[[dependencies.craftingveloce]]
    modId="alchemistry"
    type="optional"
    versionRange="[2.4.0,)"
    ordering="AFTER"
    side="BOTH"

# MEKANISM - FE-powered item machines (crusher, enrichment, combiner, sawmill).
[[dependencies.craftingveloce]]
    modId="mekanism"
    type="optional"
    versionRange="[10.7.0,)"
    ordering="AFTER"
    side="BOTH"

# JEI - recipe viewer. Optional, and that is not a courtesy: the plugin
# (compat/jei/VeloceJeiPlugin) has a foreign type in its signature, so without
# JEI nothing would load it - JEI itself scans for the @JeiPlugin annotation.
# Without JEI the mod works normally, it just lacks the "this can be made in"
# list.
[[dependencies.craftingveloce]]
    modId="jei"
    type="optional"
    versionRange="[19.0.0,)"
    ordering="AFTER"
    side="BOTH"

# JADE - the crosshair tooltip: speed/SU/energy, network state and status
# ("not enough power"). Just like JEI: the plugin (compat/jade/VeloceJadePlugin)
# has foreign types in its signatures and Jade loads it itself via the
# @WailaPlugin annotation.
[[dependencies.craftingveloce]]
    modId="jade"
    type="optional"
    versionRange="[15.0.0,)"
    ordering="AFTER"
    side="BOTH"


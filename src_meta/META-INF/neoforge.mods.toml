modLoader="javafml"
loaderVersion="[1,)"
license="MIT License"

[[mods]]
modId="craftingveloce"
version="1.2.0"
displayName="CraftingVeloce"
authors="olafek"
# displayURL and logoFile MUST sit inside [[mods]], not at the top of the file.
#
# It looks like they belong next to `license` - the NeoForge docs list all three as
# file-level properties - but the mod list reads both of them from the MOD's own config
# table, not the file's: ModListScreen calls selectedMod.getConfig().getConfigElement(...),
# and FML builds that table from the [[mods]] entry alone (ModFileInfo does
# `new ModInfo(this, mi)` where `mi` comes from getConfigList("mods")).
#
# A top-level displayURL is therefore not rejected, not warned about, and not shown -
# which is exactly the bug this comment exists to prevent someone re-introducing.
displayURL="https://github.com/olaftnt/CraftingVeloce"
# Path inside the jar, resolved from the jar root (ModListScreen reads it with
# PackResources.getRootResource). 512x512, the size Modrinth and CurseForge want too.
logoFile="logo.png"
description='''
Recursive auto-crafting and a storage terminal in one network. With one click, it lets you make complicated items when the resources are in the network.
'''

[[dependencies.craftingveloce]]
    modId="neoforge"
    type="required"
    versionRange="[21.0.0-beta,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.craftingveloce]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.0,1.21.2)"
    ordering="NONE"
    side="BOTH"

# TOM'S SIMPLE STORAGE - OPTIONAL.
#
# It used to be required, because the mod inherited from Tom's classes:
#   VelocePipeBlockEntity        extended  PlatformBlockEntity
#   VeloceTomTerminalBlock       extended  AbstractStorageTerminalBlock
#   VeloceTomTerminalBlockEntity extended  StorageTerminalBlockEntity
# A class cannot be loaded without its superclass, so a missing Tom meant
# NoClassDefFoundError during block registration - an unreadable crash instead of
# a readable "missing dependency".
#
# That is gone: com.craftingveloce.storage now carries our own base block entity
# and our own inventory lookup, and the terminal has its own block. The mod
# compiles and runs with no Tom class referenced anywhere.
#
# Running WITH Tom is still useful, and needs no integration code: Tom registers
# his Inventory Connector through the standard NeoForge item handler capability
# (StorageMod: Capabilities.ItemHandler.BLOCK, Content.connectorBE), and that
# handler is a view over his whole network. Point a pipe or the terminal at his
# connector and it reads his storage like any chest.
[[dependencies.craftingveloce]]
    modId="toms_storage"
    type="optional"
    versionRange="[2.4.0,)"
    ordering="AFTER"
    side="BOTH"

# REFINED STORAGE - optional. The integration (RefinedStorageHelper) is wrapped
# entirely in try/catch(Throwable) and its signatures do not use RS types, so a
# missing mod breaks nothing - the RS endpoints simply do not exist.
[[dependencies.craftingveloce]]
    modId="refinedstorage"
    type="optional"
    versionRange="[2.0.0,)"
    ordering="AFTER"
    side="BOTH"

# --- OPTIONAL INTEGRATIONS (soft dependencies) --------------------------
#
# EACH of them is "optional" ON PURPOSE. An integration module lives in
# com/craftingveloce/compat/<mod>/ and has foreign types ONLY in method
# bodies, called after checking that the mod is present (the
# XCompat.isPresent() gate). The core imports nothing from those mods -
# build.py enforces this (validate_core_isolation) along with the JAR leak
# check.
#
# Do NOT change "optional" to "required": a player without Create/Alchemistry/
# Mekanism is supposed to get a working mod without those integrations, not a
# loading error. Conversely, adding "required" fixes no error - it only makes
# the mod impossible to start.

# CREATE - kinetic machines (millstone, saw, press, basin, mechanical crafting).
# The version is pinned to the 6.0.x series: the kinetic classes are a
# "community" API that can change between versions.
[[dependencies.craftingveloce]]
    modId="create"
    type="optional"
    versionRange="[6.0.7,6.1.0)"
    ordering="AFTER"
    side="BOTH"

# ALCHEMISTRY - FE-powered chemical machines (compactor, combiner, fission).
# Comes together with AlchemyLib and ChemLib (Alchemistry's libraries).
[[dependencies.craftingveloce]]
    modId="alchemistry"
    type="optional"
    versionRange="[2.4.0,)"
    ordering="AFTER"
    side="BOTH"

# MEKANISM - FE-powered item machines (crusher, enrichment, combiner, sawmill).
[[dependencies.craftingveloce]]
    modId="mekanism"
    type="optional"
    versionRange="[10.7.0,)"
    ordering="AFTER"
    side="BOTH"

# JEI - recipe viewer. Optional, and that is not a courtesy: the plugin
# (compat/jei/VeloceJeiPlugin) has a foreign type in its signature, so without
# JEI nothing would load it - JEI itself scans for the @JeiPlugin annotation.
# Without JEI the mod works normally, it just lacks the "this can be made in"
# list.
[[dependencies.craftingveloce]]
    modId="jei"
    type="optional"
    versionRange="[19.0.0,)"
    ordering="AFTER"
    side="BOTH"

# JADE - the crosshair tooltip: speed/SU/energy, network state and status
# ("not enough power"). Just like JEI: the plugin (compat/jade/VeloceJadePlugin)
# has foreign types in its signatures and Jade loads it itself via the
# @WailaPlugin annotation.
[[dependencies.craftingveloce]]
    modId="jade"
    type="optional"
    versionRange="[15.0.0,)"
    ordering="AFTER"
    side="BOTH"

